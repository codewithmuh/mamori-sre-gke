# Code generated by slo-gen from slo/slos.yaml and slo/cuj-map.yaml; DO NOT EDIT.
# CUJ map generated 2026-11-01T00:00:00Z by cuj-discovery/test. Regenerate with `make slo-generate`.
# Mesh SLIs: success and latency of every service from Istio's client-side metrics, and per journey
# the composite of its critical services (docs/slo/slo-design.md).
apiVersion: monitoring.googleapis.com/v1
kind: ClusterRules
metadata:
  name: slo-mesh
  labels:
    app.kubernetes.io/name: slo
    app.kubernetes.io/part-of: mamori
spec:
  groups:
    - name: slo-mesh-2m
      interval: 1m
      rules:
        # Every service: share of requests answered below 500 with a good gRPC status (0, 3, 5), over 2m (client-side view).
        - record: mamori:service_mesh_availability:ratio_rate2m
          expr: |
            (
              sum by (destination_service_name) (rate(istio_requests_total{reporter="source",destination_service_namespace="boutique",response_code=~"[1-4][0-9][0-9]",grpc_response_status=~"0|3|5|"}[2m]))
              or
              0 * sum by (destination_service_name) (rate(istio_requests_total{reporter="source",destination_service_namespace="boutique"}[2m]))
            )
            /
            (sum by (destination_service_name) (rate(istio_requests_total{reporter="source",destination_service_namespace="boutique"}[2m])) > 0)
        # Every service: share of requests faster than 500 ms, over 2m.
        - record: mamori:service_mesh_latency:ratio_rate2m
          expr: |
            (
              sum by (destination_service_name) (rate(istio_request_duration_milliseconds_bucket{reporter="source",destination_service_namespace="boutique",le=~"500(\\.0*)?"}[2m]))
              or
              0 * sum by (destination_service_name) (rate(istio_request_duration_milliseconds_count{reporter="source",destination_service_namespace="boutique"}[2m]))
            )
            /
            (sum by (destination_service_name) (rate(istio_request_duration_milliseconds_count{reporter="source",destination_service_namespace="boutique"}[2m])) > 0)
          labels:
            threshold_ms: "500"
        # Every service: share of requests faster than 1000 ms, over 2m.
        - record: mamori:service_mesh_latency:ratio_rate2m
          expr: |
            (
              sum by (destination_service_name) (rate(istio_request_duration_milliseconds_bucket{reporter="source",destination_service_namespace="boutique",le=~"1000(\\.0*)?"}[2m]))
              or
              0 * sum by (destination_service_name) (rate(istio_request_duration_milliseconds_count{reporter="source",destination_service_namespace="boutique"}[2m]))
            )
            /
            (sum by (destination_service_name) (rate(istio_request_duration_milliseconds_count{reporter="source",destination_service_namespace="boutique"}[2m])) > 0)
          labels:
            threshold_ms: "1000"
        # browse: availability = product of the success ratios of currencyservice, productcatalogservice, over 2m.
        - record: mamori:cuj_mesh_availability:ratio_rate2m
          expr: |
            exp(sum(ln(
              mamori:service_mesh_availability:ratio_rate2m{destination_service_name=~"currencyservice|productcatalogservice"}
            )))
          labels:
            cuj: browse
        # browse: latency = lowest share under 500 ms among currencyservice, productcatalogservice, over 2m.
        - record: mamori:cuj_mesh_latency:ratio_rate2m
          expr: |
            min(
              mamori:service_mesh_latency:ratio_rate2m{threshold_ms="500",destination_service_name=~"currencyservice|productcatalogservice"}
            )
          labels:
            cuj: browse
        # add-to-cart: availability = product of the success ratios of cartservice, productcatalogservice, over 2m.
        - record: mamori:cuj_mesh_availability:ratio_rate2m
          expr: |
            exp(sum(ln(
              mamori:service_mesh_availability:ratio_rate2m{destination_service_name=~"cartservice|productcatalogservice"}
            )))
          labels:
            cuj: add-to-cart
        # add-to-cart: latency = lowest share under 500 ms among cartservice, productcatalogservice, over 2m.
