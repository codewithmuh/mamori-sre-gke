name: 🐛 Bug report
description: Something in the lab does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Redact project IDs, billing account IDs, tokens and keys before you paste logs.
        Security problems go through SECURITY.md, never a public issue.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one line
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands you ran and what they printed
      placeholder: |
        1. `make up`
        2. Open https://mamori.codewithmuh.com
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of the tools involved
      value: |
        - Commit or release:
        - Terraform:
        - gcloud:
        - kubectl / GKE version:
        - OS:
    validations:
      required: false
