name: 💡 Feature request
description: Suggest an improvement to the lab
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Larger changes start here so the scope is agreed before any code (see CONTRIBUTING.md).
  - type: input
    id: title
    attributes:
      label: Proposal
      description: A short, descriptive title
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen, and how you would check it works
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options and why they are worse
    validations:
      required: false
