name: release

# release-please keeps a "Release PR" open with the next version and changelog, built from
# Conventional Commits. Merging that PR creates the tag and the GitHub release.
#
# The template's image publish job (GHCR push, cosign signing, SBOM) is removed because this repo
# builds no images yet. It comes back when the repo ships its own images (the Go tools or the
# forked services), pushing to Artifact Registry instead of GHCR.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
