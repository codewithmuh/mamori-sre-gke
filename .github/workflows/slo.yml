name: slo

# The SLO rules, Cloud Monitoring and Datadog Terraform, and the catalog are generated by
# tools/slo-gen from slo/slos.yaml and the CUJ map. This fails when a change to any of them was
# not regenerated (`make slo-generate`). No path filter: the check takes seconds, and a skipped
# workflow would block a merge if it were ever made a required check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: slo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: SLO files up to date (slo-gen -check)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the CUJ map
        id: map
        # The real map once cuj-discovery has run; the example until then (same as mk/slo.mk).
        run: |
          for map in slo/cuj-map.yaml slo/cuj-map.example.yaml; do
            if [ -f "$map" ]; then
              echo "path=${map}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::warning::No CUJ map (slo/cuj-map.yaml or slo/cuj-map.example.yaml) yet; skipping the SLO check."
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.map.outputs.path != ''
        with:
          go-version-file: tools/slo-gen/go.mod
          cache-dependency-path: tools/slo-gen/go.sum
      - name: Check the generated files
        if: steps.map.outputs.path != ''
        working-directory: tools/slo-gen
        env:
          CUJ_MAP: ${{ steps.map.outputs.path }}
        run: go run . -root ../.. -slos slo/slos.yaml -cuj-map "$CUJ_MAP" -check
