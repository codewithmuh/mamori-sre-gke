name: terraform-apply

# Applies infra/envs/lab from main, started by hand only (Actions > terraform-apply > Run workflow).
# Nothing applies on push: the lab costs money while it runs, so a person decides when it changes.
# `preview` plans with the read-only identity, so the reviewer can read the plan in its job summary
# before approving; `apply` waits for that approval on the protected environment `lab`, the only
# place allowed to impersonate tf-apply, then plans again and applies exactly that plan.
on:
  workflow_dispatch:

permissions:
  contents: read

# One apply at a time, and never cancel one halfway.
concurrency:
  group: terraform-lab
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: infra/envs/lab

env:
  TERRAFORM_VERSION: "1.17.1" # keep in step with ci.yml
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }} # a secret, so it is masked in public logs

jobs:
  preview:
    name: Plan (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for short-lived Google credentials (no keys)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Init (GCS backend)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=lab"
      - name: Plan, and show it in the job summary
        run: |
          terraform plan -no-color -lock=false | tee plan.txt
          {
            echo "### Plan for infra/envs/lab at ${GITHUB_SHA::7}"
            echo "Approve the \`lab\` deployment only if this is what you expect."
            echo '````text'
            cat plan.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (lab)
    needs: preview
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    environment: lab # required reviewer; Google only lets this environment impersonate tf-apply
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for short-lived Google credentials (no keys)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Init (GCS backend)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=lab"
      - name: Plan
        # Plans again under the state lock; the plan file stays on this runner (it can hold
        # sensitive values, so it is never uploaded as an artifact).
        run: terraform plan -no-color -lock-timeout=5m -out=lab.tfplan
      - name: Apply
        run: terraform apply -no-color -lock-timeout=5m lab.tfplan
