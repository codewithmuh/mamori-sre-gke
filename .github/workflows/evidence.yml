name: evidence

# Weekly compliance evidence bundle (docs/compliance/evidence-bundle.md). Three jobs collect raw
# inputs, each with only the access it needs; the last one assembles bundle.json and summary.md
# with tools/evidence, signs every file with a build-provenance attestation and keeps the bundle
# as an artifact for 90 days. A missing input never fails the run: it is recorded as "not
# collected: <reason>" and the bundle says so. Nothing here changes the repository or the lab.
on:
  schedule:
    - cron: "17 0 * * 1" # Mondays 00:17 UTC (09:17 in Tokyo), off the busy top of the hour
  workflow_dispatch:

# Every job states what it needs.
permissions: {}

concurrency:
  group: evidence
  cancel-in-progress: false

defaults:
  run:
    shell: bash # adds -o pipefail to GitHub's default

env:
  # Bumped by hand, like the tool versions in ci.yml. Images are pinned by digest.
  SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # same version as .pre-commit-config.yaml
  TRIVY_VERSION: v0.76.1 # keep in step with ci.yml
  TERRAFORM_VERSION: "1.17.1" # keep in step with ci.yml
  KUBECTL_VERSION: v1.37.2 # keep in step with ci.yml
  KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4 # linux/amd64

jobs:
  repo:
    name: Repository (CI results, SBOM, secrets, vulnerabilities)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # list workflow runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so gitleaks scans every commit
          persist-credentials: false
      - name: Prepare the output directory
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence-part"
          echo "OUT=${RUNNER_TEMP}/evidence-part" >> "$GITHUB_ENV"

      - name: CI results on main
        id: ci
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # The 20 newest completed runs on main of every active workflow; tools/evidence keeps the
        # newest run per workflow that main itself started (push, schedule, workflow_dispatch).
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active") | .id' |
            while read -r id; do
              gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/runs" \
                -f branch=main -f status=completed -f exclude_pull_requests=true -f per_page=20 \
                --jq '.workflow_runs[] | {id, name, path, event, status, conclusion, head_sha, head_branch,
                      run_number, run_attempt, created_at, updated_at, html_url}'
            done | jq -s '.' > "${OUT}/ci-runs.json"

      # Controls that live only in GitHub's settings. Read-only calls; environments, rulesets and
      # branch rules need only actions: read and metadata. Branch protection details and the
      # Actions settings need Administration read, which GITHUB_TOKEN can't have: they are read
      # only with the optional secret EVIDENCE_ADMIN_READ_TOKEN (a fine-grained token for this
      # repository with Administration read and nothing else), and this step alone sees it.
      - name: GitHub settings (environment lab, rules on main and tags, Actions)
        id: github
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.EVIDENCE_ADMIN_READ_TOKEN }}
        run: |
          parts="${RUNNER_TEMP}/github-parts"
          mkdir -p "$parts"
          # fetch NAME TOKEN PATH: writes {"NAME": {"status": <HTTP status>, "body": <JSON or null>}}
          fetch() {
            local name=$1 token=$2 path=$3 body="${parts}/$1.body" status
            status=$(curl -sS --retry 3 --max-time 30 -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/${path}" || true)
            status=$((10#${status:-0}))
            jq -e . "$body" > /dev/null 2>&1 || echo null > "$body"
            jq -n --arg name "$name" --argjson status "$status" --slurpfile body "$body" \
              '{($name): {status: $status, body: $body[0]}}' > "${parts}/${name}.json"
          }
          fetch environment "$TOKEN" environments/lab
          fetch environmentBranchPolicies "$TOKEN" environments/lab/deployment-branch-policies
          fetch branch "$TOKEN" branches/main
          fetch branchRules "$TOKEN" rules/branches/main
          # The list carries no rules, so read each ruleset.
          fetch rulesetList "$TOKEN" "rulesets?includes_parents=true&per_page=100"
          list_status=$(jq '.rulesetList.status' "${parts}/rulesetList.json")
          details=()
          if [[ $list_status == 200 ]]; then
            for id in $(jq -r '.rulesetList.body[]?.id' "${parts}/rulesetList.json"); do
              fetch "ruleset-${id}" "$TOKEN" "rulesets/${id}"
              details+=("${parts}/ruleset-${id}.json")
            done
          fi
          jq -n --argjson list "$list_status" '[inputs | to_entries[0].value] as $d | {rulesets:
              (if $list != 200 then {status: $list, body: null}
               elif all($d[]; .status == 200) then {status: 200, body: [$d[].body]}
               else {status: ([$d[].status | select(. != 200)][0]), body: null} end)}' \
            "${details[@]}" < /dev/null > "${RUNNER_TEMP}/rulesets.json"
          rm -f "${parts}/rulesetList.json" "${details[@]}"
          mv "${RUNNER_TEMP}/rulesets.json" "${parts}/rulesets.json"
          admin=false
          if [[ -n $ADMIN_TOKEN ]]; then
            admin=true
            fetch branchProtection "$ADMIN_TOKEN" branches/main/protection
            fetch workflowPermissions "$ADMIN_TOKEN" actions/permissions/workflow
            fetch actionsPermissions "$ADMIN_TOKEN" actions/permissions
          else
            for name in branchProtection workflowPermissions actionsPermissions; do
              jq -n --arg name "$name" \
                '{($name): {status: 0, reason: "no token with Administration read (optional secret EVIDENCE_ADMIN_READ_TOKEN)", body: null}}' \
                > "${parts}/${name}.json"
            done
          fi
          jq -s --argjson admin "$admin" '{adminToken: $admin, responses: add}' "${parts}"/*.json > "${RUNNER_TEMP}/github-settings.json"
          mv "${RUNNER_TEMP}/github-settings.json" "${OUT}/github-settings.json"

      # Before Trivy, so its cache in the workspace can't end up in the SBOM.
      - name: SBOM of the repository (syft, SPDX JSON)
        id: sbom
        continue-on-error: true
        run: |
          docker run --rm -e SYFT_CHECK_FOR_APP_UPDATE=false -v "${PWD}:/src:ro" "${SYFT_IMAGE}" \
            scan dir:/src --source-name "${GITHUB_REPOSITORY}" --source-version "${GITHUB_SHA}" \
            -o spdx-json -q > "${OUT}/sbom.spdx.json"

      - name: Secrets in the Git history (gitleaks, redacted)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -v "${RUNNER_TEMP}:/out" "${GITLEAKS_IMAGE}" \
            git /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /out/gitleaks-raw.json
          # Keep only where and what kind: no secret (already redacted), author, email or message.
          jq '[.[] | {RuleID, Description, File, StartLine, EndLine, Commit, Date, Fingerprint}]' \
            "${RUNNER_TEMP}/gitleaks-raw.json" > "${OUT}/gitleaks.json"

      # Same scanners as CI, but every severity and unfixed vulnerabilities too, and never failing:
      # tools/evidence counts what would fail CI's own gate.
      - name: Vulnerabilities, misconfigurations and secrets (Trivy)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: json
          output: ${{ runner.temp }}/evidence-part/trivy.json
          exit-code: "0"

      - name: Record why an input is missing
        if: always()
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
          GITHUB_OUTCOME: ${{ steps.github.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          # record FILE OUTCOME STEP: drop a partial file and say why, unless a reason exists.
          record() {
            local f="${OUT}/$1"
            if [[ $2 != success ]]; then rm -f "$f"; fi
            if [[ ! -s $f && ! -e $f.reason ]]; then
              echo "the ${3} step ended with: ${2}; see the run log" > "${f}.reason"
            fi
          }
          record ci-runs.json "$CI_OUTCOME" "CI results"
          record github-settings.json "$GITHUB_OUTCOME" "GitHub settings"
          record sbom.spdx.json "$SBOM_OUTCOME" "syft"
          record gitleaks.json "$GITLEAKS_OUTCOME" "gitleaks"
          record trivy.json "$TRIVY_OUTCOME" "Trivy"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-part-repo
          path: ${{ runner.temp }}/evidence-part/
          retention-days: 1 # only the assembled bundle is kept
          if-no-files-found: error

  drift:
    name: Terraform drift (infra/envs/lab, as tf-plan)
    # Runs once the repository variables exist (after `make bootstrap`).
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for short-lived Google credentials (no keys)
    defaults:
      run:
        working-directory: infra/envs/lab
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }} # a secret, so it is masked in public logs
      # Plan with the settings the lab was applied with, or the plan shows them as changes:
      # alert_email (#21, optional, empty means no email channel) is a secret because it is
      # personal data; slo_enabled (#18) creates the SLOs and their alerts once set to true.
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_slo_enabled: ${{ vars.SLO_ENABLED || 'false' }} # a bool: an empty value wouldn't parse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the output directory
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence-part"
          echo "OUT=${RUNNER_TEMP}/evidence-part" >> "$GITHUB_ENV"
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.auth.outcome == 'success'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Plan with -detailed-exitcode
        id: plan
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        # -lock=false: a read-only check never takes or leaves a state lock. The plan file and the
        # full plan text can hold sensitive values (a home address in master_authorized_networks,
        # say), so they stay on this runner: the public log gets only the summary lines, and the
        # bundle only resource addresses, actions and attribute names (tools/evidence/drift.jq).
        run: |
          terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=lab"
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode -out=drift.tfplan > plan.txt 2>&1
          code=$?
          set -e
          grep -E '^(Plan: |No changes\.|Error: )' plan.txt || echo "(no summary line in the plan output)"
          if [[ $code != 0 && $code != 2 ]]; then
            echo "terraform plan failed (exit ${code}); see the summary line in the run log" > "${OUT}/terraform-drift.json.reason"
            exit 0
          fi
          terraform show -json drift.tfplan |
            jq --argjson code "$code" -f "${GITHUB_WORKSPACE}/tools/evidence/drift.jq" > drift.json
          mv drift.json "${OUT}/terraform-drift.json"
      - name: Record why the drift check is missing
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          f="${OUT}/terraform-drift.json"
          if [[ $AUTH_OUTCOME != success ]]; then
            echo "could not authenticate as tf-plan (${AUTH_OUTCOME}); see the run log" > "${f}.reason"
          elif [[ $PLAN_OUTCOME != success ]]; then
            rm -f "$f"
            [[ -e $f.reason ]] || echo "terraform init or plan failed (${PLAN_OUTCOME}); see the run log" > "${f}.reason"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-part-drift
          path: ${{ runner.temp }}/evidence-part/
          retention-days: 1
          if-no-files-found: error

  cluster:
    name: Cluster and SLOs (as evidence-reader)
    # evidence-reader trusts only this workflow on main (infra/bootstrap/evidence_identity.tf).
    if: vars.GCP_WIF_PROVIDER != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 15
    permissions:
      id-token: write # exchange the GitHub OIDC token for short-lived Google credentials (no keys)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      ZONE: ${{ vars.GCP_ZONE || 'asia-northeast1-a' }}
      CLUSTER: mamori
    steps:
      # No new repository variables: the evidence pool sits next to the shared one in the same
      # project, and the account name is fixed in infra/bootstrap/evidence_identity.tf.
      - name: Prepare the output directory and identity names
        id: names
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence-part"
          echo "OUT=${RUNNER_TEMP}/evidence-part" >> "$GITHUB_ENV"
          # projects/<number>/locations/global/workloadIdentityPools/github/providers/github-actions
          echo "provider=${GCP_WIF_PROVIDER%%/workloadIdentityPools/*}/workloadIdentityPools/github-evidence/providers/github-actions" >> "$GITHUB_OUTPUT"
          echo "account=evidence-reader@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.names.outputs.provider }}
          service_account: ${{ steps.names.outputs.account }}
          token_format: access_token # for the REST calls and kubectl below
          access_token_lifetime: 900s
          create_credentials_file: false

      - name: Cluster versions and node pools (GKE API)
        id: gke
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          raw="${RUNNER_TEMP}/cluster-raw.json"
          code=$(curl -sS --retry 3 --max-time 30 -o "$raw" -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" \
            "https://container.googleapis.com/v1/projects/${PROJECT_ID}/locations/${ZONE}/clusters/${CLUSTER}")
          case $code in
            200)
              # Versions and pools only; the endpoint and CA certificate stay on the runner.
              jq '{name, location, status, currentMasterVersion, currentNodeVersion, releaseChannel,
                   nodePools: [.nodePools[]? | {name, version, status,
                     config: {machineType: .config.machineType, spot: (.config.spot // false)},
                     autoscaling: {enabled: (.autoscaling.enabled // false)}}]}' "$raw" > "${raw}.out"
              mv "${raw}.out" "${OUT}/gke-cluster.json"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              for f in gke-cluster.json nodes.json gatekeeper-constraints.json argocd-applications.json; do
                echo "cluster ${CLUSTER} not found in ${ZONE}: the lab is down" > "${OUT}/${f}.reason"
              done
              ;;
            *)
              echo "::error::GKE API returned HTTP ${code}"
              exit 1
              ;;
          esac
      - name: Install kubectl (checksum verified)
        if: steps.gke.outputs.exists == 'true'
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "$bin"
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${bin}/kubectl" | sha256sum --check --strict
          chmod +x "$bin/kubectl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Nodes, Gatekeeper constraints, Argo CD applications (Kubernetes API)
        id: kube
        if: steps.gke.outputs.exists == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          raw="${RUNNER_TEMP}/cluster-raw.json"
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          umask 077
          cat > "$KUBECONFIG" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: ${CLUSTER}
              cluster:
                server: https://$(jq -r '.endpoint' "$raw")
                certificate-authority-data: $(jq -r '.masterAuth.clusterCaCertificate' "$raw")
          users:
            - name: evidence-reader
              user:
                token: ${TOKEN}
          contexts:
            - name: ${CLUSTER}
              context: {cluster: ${CLUSTER}, user: evidence-reader}
          current-context: ${CLUSTER}
          EOF
          # get FILE ARGS...: list objects as JSON, minus bulky fields, or record kubectl's error.
          # Files appear whole or not at all.
          get() {
            local file=$1 tmp="${RUNNER_TEMP}/$1"
            shift
            if kubectl get "$@" -o json --request-timeout=30s > "$tmp" 2> "${tmp}.err"; then
              jq 'del(.items[]?.metadata.managedFields, .items[]?.status.images,
                      .items[]?.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration")' \
                "$tmp" > "${tmp}.out"
              mv "${tmp}.out" "${OUT}/${file}"
            else
              # The log is public too: keep the control plane's address out of both.
              sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' "${tmp}.err" > "${tmp}.masked"
              cat "${tmp}.masked" >&2
              echo "kubectl get $* failed: $(head -n 1 "${tmp}.masked")" > "${OUT}/${file}.reason"
            fi
          }
          get nodes.json nodes
          get gatekeeper-constraints.json constraints # every constraint kind (Gatekeeper's category)
          get argocd-applications.json applications.argoproj.io --all-namespaces

      - name: SLO status and error budgets (Cloud Monitoring API)
        id: slo
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          api=https://monitoring.googleapis.com/v3
          call() { curl -fsS --retry 3 --max-time 30 -H "Authorization: Bearer ${TOKEN}" --get "$@"; }
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          start=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
          # latest SELECTOR SLO: newest point of select_slo_compliance or select_slo_budget_fraction
          # in the last hour, or null.
          latest() {
            call "${api}/projects/${PROJECT_ID}/timeSeries" \
              --data-urlencode "filter=$1(\"$2\")" \
              --data-urlencode "interval.startTime=${start}" \
              --data-urlencode "interval.endTime=${end}" |
              jq '[.timeSeries[]?.points[]?] | sort_by(.interval.endTime) | last | .value.doubleValue // null'
          }
          lines="${RUNNER_TEMP}/slos.ndjson"
          : > "$lines"
          call "${api}/projects/${PROJECT_ID}/services" --data-urlencode pageSize=200 |
            jq -c '.services[]? | {name, displayName: (.displayName // "")}' |
            while read -r svc; do
              svc_name=$(jq -r .name <<< "$svc")
              call "${api}/${svc_name}/serviceLevelObjectives" --data-urlencode pageSize=200 |
                jq -c '.serviceLevelObjectives[]? | {name, displayName, goal, rollingPeriod, calendarPeriod}' |
                while read -r objective; do
                  name=$(jq -r .name <<< "$objective")
                  compliance=$(latest select_slo_compliance "$name")
                  budget=$(latest select_slo_budget_fraction "$name")
                  jq -c --argjson svc "$svc" --argjson compliance "$compliance" --argjson budget "$budget" \
                    '. + {service: $svc.name, serviceDisplayName: $svc.displayName,
                          compliance: $compliance, budgetFraction: $budget}' <<< "$objective" >> "$lines"
                done
            done
          jq -s --arg at "$end" '{collectedAt: $at, slos: .}' "$lines" > "${lines}.out"
          mv "${lines}.out" "${OUT}/slo-status.json"

      - name: Record why an input is missing
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          GKE_OUTCOME: ${{ steps.gke.outcome }}
          KUBE_OUTCOME: ${{ steps.kube.outcome }}
          SLO_OUTCOME: ${{ steps.slo.outcome }}
        run: |
          # The steps above write each file whole (or a reason), so nothing partial is left.
          # record REASON FILE...: give every file that has neither content nor a reason this one.
          record() {
            local reason=$1
            shift
            for f in "$@"; do
              [[ -s ${OUT}/$f || -e ${OUT}/$f.reason ]] || echo "$reason" > "${OUT}/${f}.reason"
            done
          }
          if [[ $AUTH_OUTCOME != success ]]; then
            record "could not authenticate as evidence-reader; is infra/bootstrap/evidence_identity.tf applied?" \
              gke-cluster.json nodes.json gatekeeper-constraints.json argocd-applications.json slo-status.json
          fi
          record "the GKE API step ended with: ${GKE_OUTCOME}; see the run log" \
            gke-cluster.json nodes.json gatekeeper-constraints.json argocd-applications.json
          record "the Kubernetes API step ended with: ${KUBE_OUTCOME}; see the run log" \
            nodes.json gatekeeper-constraints.json argocd-applications.json
          record "the Cloud Monitoring step ended with: ${SLO_OUTCOME}; see the run log" slo-status.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-part-cluster
          path: ${{ runner.temp }}/evidence-part/
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble, attest and keep the bundle
    needs: [repo, drift, cluster]
    if: ${{ !cancelled() }} # also when a collecting job failed or was skipped: the bundle says what is missing
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the attestation with a short-lived Sigstore certificate
      attestations: write # store the attestation with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/evidence/go.mod
          cache: false # standard library only; nothing to cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-part-*
          merge-multiple: true
          path: bundle/inputs
      - name: Record inputs of jobs that didn't run
        env:
          HAS_WIF: ${{ vars.GCP_WIF_PROVIDER != '' }}
          REF: ${{ github.ref }}
          REPO_RESULT: ${{ needs.repo.result }}
          DRIFT_RESULT: ${{ needs.drift.result }}
          CLUSTER_RESULT: ${{ needs.cluster.result }}
        run: |
          mkdir -p bundle/inputs
          # mark REASON FILE...: for files with neither content nor a reason.
          mark() {
            local reason=$1
            shift
            for f in "$@"; do
              [[ -s bundle/inputs/$f || -e bundle/inputs/$f.reason ]] || echo "$reason" > "bundle/inputs/${f}.reason"
            done
          }
          # why JOB RESULT
          why() {
            if [[ $2 == skipped && $HAS_WIF != true ]]; then
              echo "Google Cloud is not set up yet: repository variable GCP_WIF_PROVIDER is empty"
            elif [[ $2 == skipped && $1 == cluster && $REF != refs/heads/main ]]; then
              echo "collected only on main (evidence-reader trusts this workflow on main only); this run is on ${REF}"
            elif [[ $2 == success ]]; then
              echo "the ${1} job finished without writing this input or a reason; see the run log"
            else
              echo "the ${1} job ended with: ${2}; see the run log"
            fi
          }
          mark "$(why repo "$REPO_RESULT")" ci-runs.json github-settings.json sbom.spdx.json gitleaks.json trivy.json
          mark "$(why drift "$DRIFT_RESULT")" terraform-drift.json
          mark "$(why cluster "$CLUSTER_RESULT")" gke-cluster.json nodes.json gatekeeper-constraints.json \
            argocd-applications.json slo-status.json
      - name: Assemble bundle.json and summary.md
        id: bundle
        env:
          HAS_WIF: ${{ vars.GCP_WIF_PROVIDER != '' }}
          REF: ${{ github.ref }}
        run: |
          # What this run should have collected. A section that was expected but is missing needs a
          # look, so a step that fails every week can't hide behind "not collected".
          expect=ci,github,trivy,gitleaks,sbom
          if [[ $HAS_WIF == true ]]; then
            expect+=,terraformDrift
            if [[ $REF == refs/heads/main ]]; then
              expect+=,cluster,gatekeeper,argocd,slos
            fi
          fi
          go build -C tools/evidence -trimpath -o "${RUNNER_TEMP}/evidence" .
          "${RUNNER_TEMP}/evidence" -inputs bundle/inputs -out bundle -expect "$expect"
          # One line per file of the bundle, paths relative to it: `sha256sum -c SHA256SUMS` checks them.
          (cd bundle && find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum) > "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" bundle/SHA256SUMS
          cat bundle/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "name=evidence-$(date -u +%Y-%m-%d)-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      # Signed SLSA build provenance for every file: proves it came from this workflow at this
      # commit. Verify with `gh attestation verify` (docs/compliance/evidence-bundle.md).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: bundle/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: bundle/
          retention-days: 90 # the most GitHub keeps an artifact of a public repository
          if-no-files-found: error
