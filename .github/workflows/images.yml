name: images

# Builds every container image of the repository: tools/*/Dockerfile, services/*/Dockerfile and
# agent/Dockerfile, each named after its directory.
#
# - Pull requests: Go tests for services/* modules (tools/* are tested by ci.yml), docker build,
#   Trivy scan of the image. Nothing leaves the runner.
# - main: the same, then push to Artifact Registry as
#   asia-northeast1-docker.pkg.dev/<project>/mamori/<name>:<git sha>, sign with cosign (keyless)
#   and attach a signed SPDX SBOM. Skipped while the repository variable GCP_WIF_PROVIDER is unset.
# - Releases: release.yml calls this workflow with the version (or run it by hand with one), and
#   the images built from tag v<version> are published as :<version> too. Manifests in deploy/
#   use version tags.
#
# How to verify a signature, and why the lab's images live only as long as the lab: docs/images.md.
on:
  pull_request:
    paths:
      - tools/**
      - services/**
      - agent/**
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths: # same list as for pull requests
      - tools/**
      - services/**
      - agent/**
      - .github/workflows/images.yml
  workflow_dispatch:
    inputs:
      version:
        description: Release to publish (X.Y.Z, built from tag vX.Y.Z). Empty publishes main as :<git sha> only.
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: Release to publish (X.Y.Z, built from tag vX.Y.Z).
        type: string
        required: true

# Least privilege by default; only the publish job may ask GitHub for an OIDC token.
permissions:
  contents: read

# Cancel superseded pull request runs. Every other run gets its own group, so no publish waits for
# or cancels another.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # adds -o pipefail to GitHub's default

env:
  # Release being published (workflow_call, workflow_dispatch); empty for pushes and pull requests.
  VERSION: ${{ inputs.version }}
  # What to build: the release tag; empty means the commit that triggered the run (checkout's default).
  SOURCE_REF: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || '' }}
  TRIVY_VERSION: v0.76.1 # keep in step with ci.yml
  COSIGN_VERSION: v3.1.4
  REGION: asia-northeast1

jobs:
  discover:
    name: Find images
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - name: Check the inputs
        env:
          PUBLISHING_CONFIGURED: ${{ vars.GCP_WIF_PROVIDER != '' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [[ $PUBLISHING_CONFIGURED == true && -z $PROJECT_ID ]]; then
            echo "::error::GCP_WIF_PROVIDER is set but GCP_PROJECT_ID is not (see make bootstrap)."
            exit 1
          fi
          if [[ -n $VERSION && ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '${VERSION}'"
            exit 1
          fi
          # A release that silently isn't published would leave deploy/ pointing at a missing tag.
          if [[ -n $VERSION && $PUBLISHING_CONFIGURED != true ]]; then
            echo "::error::Publishing ${VERSION} needs the repository variables from infra/bootstrap (GCP_WIF_PROVIDER, GCP_PROJECT_ID)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: List Dockerfiles
        id: find
        run: |
          shopt -s nullglob
          images='[]'
          for dockerfile in tools/*/Dockerfile services/*/Dockerfile agent/Dockerfile; do
            [[ -f $dockerfile ]] || continue # agent/ may not exist yet
            dir=$(dirname "$dockerfile")
            name=$(basename "$dir")
            if [[ ! $name =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error file=${dockerfile}::'${name}' can't be an image name (lowercase letters, digits and dashes only)"
              exit 1
            fi
            # Go tests here only for services/; tools/* modules are tested by ci.yml.
            go=false
            if [[ $dir == services/* && -f $dir/go.mod ]]; then go=true; fi
            images=$(jq -c --arg name "$name" --arg dir "$dir" --argjson go "$go" \
              '. + [{name: $name, dir: $dir, go: $go}]' <<<"$images")
          done
          # tools/x and services/x would push to the same registry path.
          dupes=$(jq -r 'group_by(.name) | map(select(length > 1) | .[0].name) | join(", ")' <<<"$images")
          if [[ -n $dupes ]]; then
            echo "::error::Two image directories share a name: ${dupes}"
            exit 1
          fi
          if [[ $images == '[]' ]]; then
            echo "::notice::No Dockerfiles under tools/, services/ or agent/ yet; nothing to build."
          fi
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          jq . <<<"$images"

  check:
    name: Check ${{ matrix.image.name }} (tests, build, scan)
    needs: discover
    # Pull requests, and main while publishing is not set up yet (then this is all main gets).
    if: >-
      needs.discover.outputs.images != '[]'
      && (github.event_name == 'pull_request' || vars.GCP_WIF_PROVIDER == '')
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      LOCAL_IMAGE: local/${{ matrix.image.name }}:${{ github.sha }}
      DIR: ${{ matrix.image.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.image.go
        with:
          go-version-file: ${{ matrix.image.dir }}/go.mod # uses its toolchain directive
          cache-dependency-path: ${{ matrix.image.dir }}/go.sum
      - name: Go tests (race detector)
        if: matrix.image.go
        working-directory: ${{ matrix.image.dir }}
        run: go test -race -count=1 ./...
      - name: Build
        # linux/amd64: the cluster's nodes (e2-standard-2). No BuildKit attestations: the signed
        # SBOM is attached by cosign when the image is published.
        run: docker build --pull --platform linux/amd64 --provenance=false --sbom=false -t "$LOCAL_IMAGE" "$DIR"
      - name: Scan the image (fixable HIGH and CRITICAL fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish ${{ matrix.image.name }}
    needs: discover
    # Only from main (the only ref Google lets impersonate ci-images), once bootstrap is applied.
    if: >-
      needs.discover.outputs.images != '[]'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    permissions:
      contents: read
      id-token: write # Google credentials through Workload Identity Federation, and the Sigstore certificate for keyless signing
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      LOCAL_IMAGE: local/${{ matrix.image.name }}:${{ github.sha }}
      DIR: ${{ matrix.image.dir }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mamori/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.image.go
        with:
          go-version-file: ${{ matrix.image.dir }}/go.mod # uses its toolchain directive
          cache-dependency-path: ${{ matrix.image.dir }}/go.sum
      - name: Go tests (race detector)
        if: matrix.image.go
        working-directory: ${{ matrix.image.dir }}
        run: go test -race -count=1 ./...
      # Build and scan before any credentials exist on the runner.
      - name: Build
        run: docker build --pull --platform linux/amd64 --provenance=false --sbom=false -t "$LOCAL_IMAGE" "$DIR"
      - name: Scan the image (fixable HIGH and CRITICAL stop the publish)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_IMAGES_SA || format('ci-images@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}
          token_format: access_token
          access_token_lifetime: 1200s # push, sign and attest take minutes
          create_credentials_file: false # nothing on disk that a later step could leak
      - name: Log in to Artifact Registry
        id: registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          # The repository belongs to the lab root, so `make down` deletes it (with its images).
          # A push to main while the lab is down is not an error; a release publish is.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://artifactregistry.googleapis.com/v1/projects/${PROJECT_ID}/locations/${REGION}/repositories/mamori") || true
          if [[ $status != 200 ]]; then
            message="Artifact Registry repository mamori is not reachable (HTTP ${status}); is the lab down? Nothing was published."
            if [[ -n $VERSION ]]; then
              echo "::error::${message} Run this workflow again with version ${VERSION} after make up."
              exit 1
            fi
            echo "::warning::${message}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker login --username oauth2accesstoken --password-stdin "https://${REGION}-docker.pkg.dev" <<<"$ACCESS_TOKEN"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Push
        id: push
        if: steps.registry.outputs.ready == 'true'
        run: |
          sha=$(git rev-parse HEAD) # for a release, the tagged commit
          tags=("$sha")
          if [[ -n $VERSION ]]; then
            # Version tags are never moved: deploy/ refers to them.
            if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "::error::${IMAGE}:${VERSION} already exists; version tags are not overwritten."
              exit 1
            fi
            tags+=("$VERSION")
          fi
          for tag in "${tags[@]}"; do
            docker tag "$LOCAL_IMAGE" "${IMAGE}:${tag}"
            docker push --quiet "${IMAGE}:${tag}"
          done
          digest=$(docker buildx imagetools inspect "${IMAGE}:${sha}" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the digest of ${IMAGE}:${sha}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.registry.outputs.ready == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign (keyless, with this workflow's GitHub identity)
        if: steps.registry.outputs.ready == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # Signs the digest, so the signature covers every tag that points at it.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Generate the SBOM (SPDX)
        if: steps.registry.outputs.ready == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json
      - name: Attach the SBOM as a signed attestation
        if: steps.registry.outputs.ready == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
      - name: Summary
        if: steps.registry.outputs.ready == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.push.outputs.tags }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/images.yml@refs/heads/main
        run: |
          {
            echo "### ${IMAGE}"
            echo "- digest \`${DIGEST}\`, tags: \`${TAGS}\`"
            echo "- verify (see docs/images.md):"
            echo '```sh'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity '${IDENTITY}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of Artifact Registry
        if: always()
        run: docker logout "https://${REGION}-docker.pkg.dev" || true
