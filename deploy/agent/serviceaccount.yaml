# Kubernetes service account `agent`. Google Cloud grants go to its Workload Identity principal
# directly (infra/bootstrap/agent_identity.tf, infra/envs/lab/agent.tf), so it needs no
# iam.gke.io/gcp-service-account annotation and there is no Google service account or key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: mamori-agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: mamori
