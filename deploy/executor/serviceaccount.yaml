# The executor's own identity. It holds the only write rights the incident path has; the
# agent's service account (agent, #24) is read-only. No Google Cloud identity: the executor
# talks only to the Kubernetes API and to Slack.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: executor
  namespace: mamori-agent
  labels:
    app.kubernetes.io/name: executor
    app.kubernetes.io/part-of: mamori
