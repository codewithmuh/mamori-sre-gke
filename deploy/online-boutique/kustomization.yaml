# Online Boutique v0.10.7 (github.com/GoogleCloudPlatform/microservices-demo, Apache-2.0), unchanged
# except for what this file says. Remote refs are pinned to the commit the v0.10.7 tag points to,
# so a moved tag cannot change what we deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique

resources:
  - namespace.yaml
  # 11 Deployments (10 services + the Locust load generator) plus redis-cart.
  - https://github.com/GoogleCloudPlatform/microservices-demo//kustomize/base?ref=5b608cb1dfe317d05e4f1bb8c99b7618452fde87 # v0.10.7
  # Accept mamori.codewithmuh.com on the Istio ingress gateway and route it to the frontend.
  - public-gateway.yaml
  - public-virtualservice.yaml

components:
  # Adds ServiceEntries for Google APIs and the metadata server, a mesh VirtualService for the
  # frontend, a Gateway API Gateway + HTTPRoute of class "istio", and deletes the frontend-external
  # LoadBalancer Service.
  - https://github.com/GoogleCloudPlatform/microservices-demo//kustomize/components/service-mesh-istio?ref=5b608cb1dfe317d05e4f1bb8c99b7618452fde87 # v0.10.7

patches:
  # The component's Gateway API Gateway (class "istio") would make istiod create its own gateway
  # Deployment and a LoadBalancer Service. Our entry is the GKE Gateway (deploy/edge) in front of
  # the Helm-installed ingress gateway, so drop the component's Gateway and its HTTPRoute.
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: Gateway
      metadata:
        name: istio-gateway
      $patch: delete
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: HTTPRoute
      metadata:
        name: frontend-route
      $patch: delete
  # The component hard-codes the "default" namespace in its VirtualService host.
  - target:
      group: networking.istio.io
      kind: VirtualService
      name: frontend
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: frontend.boutique.svc.cluster.local
  # Site-wide banner. The v0.10.7 frontend reads FRONTEND_MESSAGE (src/frontend/handlers.go) and
  # header.html shows it at the top of every page, error pages included.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: FRONTEND_MESSAGE
                    value: "Demo shop, no real payments. Do not enter real card details."

images:
  # Same tags as upstream v0.10.7, plus digests so the images cannot change under the tag.
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
    newTag: v0.10.7@sha256:7b26b5ea1a6472ca62b3c20c6f6ac12dd1fbcf18ba596a2c174982bcccdfc0c8
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
    newTag: v0.10.7@sha256:e5310c2aa45732e351c55c88051700d958dc7ed2693e66405fc6c70cf080109e
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice
    newTag: v0.10.7@sha256:f0e72ff7b438dd2e8776fb142d5132cfa5ba02c523466f1491270c576412d33f
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice
