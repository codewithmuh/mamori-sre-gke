  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    newTag: v0.10.7@sha256:e1ff27c553f7e0c31f4a10f1950ec0ee34cd41d77dd819b1fcfa139273891602
