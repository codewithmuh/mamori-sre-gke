# PR-04: images come only from registries this project uses on purpose. A new source of images
# is added here in the same pull request that brings the image, so the list stays an inventory.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedReposv2
metadata:
  name: pr-04-allowed-registries
  labels:
    app.kubernetes.io/part-of: mamori
  annotations:
    # After the ConstraintTemplates (wave 0 of this Application); the dry run at the start of the
    # first sync can't know this kind until Gatekeeper has made its CRD from the template.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    mamori.dev/control-id: PR-04
    mamori.dev/checklist-item: "Image security: scan images before deploying them (only registries we know and scan)"
    mamori.dev/source: "https://kubernetes.io/docs/concepts/security/application-security-checklist/"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  parameters:
    # Exact match, or prefix match where the entry ends in "*". Prefixes end in "/" or ":" so that,
    # say, "redis-evil" can't pass as "redis".
    allowedImages:
      # Our own images (tools, agent, the frontend fork). scripts/set-registry.sh replaces PROJECT_ID.
      - "asia-northeast1-docker.pkg.dev/PROJECT_ID/mamori/*"
      # Upstream Online Boutique v0.10.7, pinned by digest in deploy/online-boutique.
      - "us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/*"
      # Istio's proxy, injected as istio-init, the sidecar and the ingress gateway.
      - "docker.io/istio/*"
      # Docker Hub official images Online Boutique uses (redis-cart, the load generator's wait step).
      - "redis:*"
      - "busybox:*"
      # Istio's gateway placeholder (see pr-03-no-latest-tag.yaml).
      - "auto"
