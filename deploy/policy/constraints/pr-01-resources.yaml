# PR-01: every container states the CPU and memory it needs and the most memory it may use.
# A CPU limit is not required: Google's guidance is to leave CPU unbounded, and the Kubernetes
# application security checklist only asks for one on sensitive workloads.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: pr-01-resources
  labels:
    app.kubernetes.io/part-of: mamori
  annotations:
    # After the ConstraintTemplates (wave 0 of this Application); the dry run at the start of the
    # first sync can't know this kind until Gatekeeper has made its CRD from the template.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    mamori.dev/control-id: PR-01
    mamori.dev/checklist-item: "Set appropriate resource requests and limits"
    mamori.dev/source: "https://docs.cloud.google.com/architecture/best-practices-for-running-cost-effective-kubernetes-applications-on-gke"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  parameters:
    requests: ["cpu", "memory"]
    limits: ["memory"]
