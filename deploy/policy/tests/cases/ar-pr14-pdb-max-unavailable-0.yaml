# Breaks the rule on purpose: PR-14, a PDB that allows no eviction at all, so a node drain
# (GKE upgrade, Spot replacement) waits on it.
# Written as the AdmissionReview request the API server sends to Gatekeeper: it is a test
# input, not a manifest to deploy, and repo scanners such as Trivy don't read it as one.
apiVersion: admission.k8s.io/v1
kind: AdmissionReview
request:
  uid: ar-pr14-pdb-max-unavailable-0
  kind:
    group: policy
    version: v1
    kind: PodDisruptionBudget
  resource:
    group: policy
    version: v1
    resource: poddisruptionbudgets
  namespace: boutique
  name: frontend-no-eviction
  operation: CREATE
  userInfo:
    username: gator-test
  object:
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: frontend-no-eviction
      namespace: boutique
    spec:
      maxUnavailable: 0
      selector:
        matchLabels:
          app: frontend
