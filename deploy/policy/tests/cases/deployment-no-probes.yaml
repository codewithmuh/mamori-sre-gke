# Fails PR-02 through expansion: the Deployment itself is not a Pod, but ../expansion.yaml turns
# its pod template into one, which is how `gator test` judges the rendered Git manifests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  namespace: boutique
  labels:
    app.kubernetes.io/name: loadgenerator
    app.kubernetes.io/part-of: mamori
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
        app.kubernetes.io/name: loadgenerator
        app.kubernetes.io/part-of: mamori
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: asia-northeast1-docker.pkg.dev/PROJECT_ID/mamori/loadgenerator:0.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
