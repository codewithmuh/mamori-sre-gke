# Breaks the rule on purpose: PR-01, requests but no memory limit.
# Written as the AdmissionReview request the API server sends to Gatekeeper: it is a test
# input, not a manifest to deploy, and repo scanners such as Trivy don't read it as one.
apiVersion: admission.k8s.io/v1
kind: AdmissionReview
request:
  uid: ar-pr01-no-memory-limit
  kind:
    group: ""
    version: v1
    kind: Pod
  resource:
    group: ""
    version: v1
    resource: pods
  namespace: boutique
  name: no-memory-limit
  operation: CREATE
  userInfo:
    username: gator-test
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: no-memory-limit
      namespace: boutique
      labels:
        app.kubernetes.io/name: no-memory-limit
        app.kubernetes.io/part-of: mamori
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: asia-northeast1-docker.pkg.dev/PROJECT_ID/mamori/prober:0.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
