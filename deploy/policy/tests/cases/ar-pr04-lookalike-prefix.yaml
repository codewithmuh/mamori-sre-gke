# Breaks the rule on purpose: PR-04, a repository whose name only starts like an allowed one (docker.io/istio-mirror).
# Written as the AdmissionReview request the API server sends to Gatekeeper: it is a test
# input, not a manifest to deploy, and repo scanners such as Trivy don't read it as one.
apiVersion: admission.k8s.io/v1
kind: AdmissionReview
request:
  uid: ar-pr04-lookalike-prefix
  kind:
    group: ""
    version: v1
    kind: Pod
  resource:
    group: ""
    version: v1
    resource: pods
  namespace: boutique
  name: lookalike-registry
  operation: CREATE
  userInfo:
    username: gator-test
  object:
    apiVersion: v1
    kind: Pod
    metadata:
      name: lookalike-registry
      namespace: boutique
      labels:
        app.kubernetes.io/name: lookalike-registry
        app.kubernetes.io/part-of: mamori
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: docker.io/istio-mirror/proxyv2:1.31.4
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
