# Breaks the rule on purpose: PR-12, a LoadBalancer Service (upstream's frontend-external).
# Written as the AdmissionReview request the API server sends to Gatekeeper: it is a test
# input, not a manifest to deploy, and repo scanners such as Trivy don't read it as one.
apiVersion: admission.k8s.io/v1
kind: AdmissionReview
request:
  uid: ar-pr12-loadbalancer
  kind:
    group: ""
    version: v1
    kind: Service
  resource:
    group: ""
    version: v1
    resource: services
  namespace: boutique
  name: frontend-external
  operation: CREATE
  userInfo:
    username: gator-test
  object:
    apiVersion: v1
    kind: Service
    metadata:
      name: frontend-external
      namespace: boutique
    spec:
      type: LoadBalancer
      selector:
        app: frontend
      ports:
        - name: http
          port: 80
          targetPort: 8080
