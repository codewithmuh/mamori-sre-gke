# Passes every Pod policy (PR-01 to PR-11): labels, a tagged image from our registry, CPU and
# memory requests and a memory limit (no CPU limit, on purpose), both probes, non-root, no
# privilege escalation, all capabilities dropped.
apiVersion: v1
kind: Pod
metadata:
  name: prober
  namespace: boutique
  labels:
    app.kubernetes.io/name: prober
    app.kubernetes.io/part-of: mamori
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: server
      image: asia-northeast1-docker.pkg.dev/PROJECT_ID/mamori/prober:0.1.0
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
