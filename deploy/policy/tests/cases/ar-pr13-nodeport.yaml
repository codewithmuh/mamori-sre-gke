# Breaks the rule on purpose: PR-13, a NodePort Service.
# Written as the AdmissionReview request the API server sends to Gatekeeper: it is a test
# input, not a manifest to deploy, and repo scanners such as Trivy don't read it as one.
apiVersion: admission.k8s.io/v1
kind: AdmissionReview
request:
  uid: ar-pr13-nodeport
  kind:
    group: ""
    version: v1
    kind: Service
  resource:
    group: ""
    version: v1
    resource: services
  namespace: boutique
  name: frontend-nodeport
  operation: CREATE
  userInfo:
    username: gator-test
  object:
    apiVersion: v1
    kind: Service
    metadata:
      name: frontend-nodeport
      namespace: boutique
    spec:
      type: NodePort
      selector:
        app: frontend
      ports:
        - name: http
          port: 80
          targetPort: 8080
