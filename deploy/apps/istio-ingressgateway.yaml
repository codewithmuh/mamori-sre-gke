# Wave 2: the mesh's ingress gateway (Envoy), behind the GKE Gateway. Its Service is ClusterIP.
# It needs istiod's injection webhook, which is why it waits for wave 1 to be healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://blob.istio.io/istio-release/charts
      chart: gateway
      targetRevision: 1.31.4
      helm:
        releaseName: istio-ingressgateway
        valueFiles:
          - $values/deploy/istio/gateway-values.yaml
    - repoURL: https://github.com/codewithmuh/mamori-sre-gke.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Keep retrying a failed sync (see deploy/bootstrap/root-app.yaml for why).
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
