# Wave 6: SLO recording rules for Managed Service for Prometheus (deploy/slo, generated by
# tools/slo-gen from slo/slos.yaml and the CUJ map; edit those, not deploy/slo).
# After the prober (wave 5), which creates the namespace "prober" that holds the prober rules.
# The mesh rules are cluster-scoped (ClusterRules).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/codewithmuh/mamori-sre-gke.git
    targetRevision: main
    path: deploy/slo
  destination:
    server: https://kubernetes.default.svc
    namespace: prober
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
