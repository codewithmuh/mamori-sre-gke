# Wave -1: cluster-wide objects (deploy/platform), such as the PriorityClass istiod and the ingress
# gateway use. Before Istio, so their pods never wait for it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/codewithmuh/mamori-sre-gke.git
    targetRevision: main
    path: deploy/platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Keep retrying a failed sync (see deploy/bootstrap/root-app.yaml for why).
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
