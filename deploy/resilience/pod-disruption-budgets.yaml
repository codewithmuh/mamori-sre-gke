# One PodDisruptionBudget per shop workload: the 10 services and redis-cart (not the load generator).
# Each allows one pod of its workload to be evicted at a time.
#
# Why maxUnavailable: 1 and not minAvailable: 1. With one replica (the default here; HPAs start at 1),
# minAvailable: 1 would forbid every eviction, and GKE would hold a node drain (an upgrade, or the
# spend guard scaling the pool to zero) for up to an hour. maxUnavailable: 1 never blocks a
# one-replica workload. It only paces a workload an HPA has scaled out: during a rolling node
# upgrade the second pod waits until the first one's replacement is Ready.
# The one case where it can still hold a drain: scaling the whole pool to zero while an HPA has 2+
# replicas, because the replacement pods have nowhere to run. GKE then gives up after one hour;
# docs/resilience/README.md ("Spend guard") gives the one-line way to cut that short.
#
# unhealthyPodEvictionPolicy AlwaysAllow (stable since Kubernetes 1.31): a pod that is not Ready
# (crash-looping, stuck) can always be evicted, so a broken pod never blocks a drain.
# Spot preemptions ignore PodDisruptionBudgets; these only cover voluntary evictions.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: adservice
  namespace: boutique
  labels:
    app.kubernetes.io/name: adservice
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: adservice
---
