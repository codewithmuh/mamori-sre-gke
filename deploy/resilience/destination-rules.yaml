---
# Redis for the carts: plain TCP (port "tcp-redis"), one stateful pod with an emptyDir. HTTP settings,
# retries and outlier detection do not apply to TCP, and ejecting the only pod would just turn errors
# into "no healthy upstream". What helps: a short connect timeout, and TCP keepalive so cartservice's
# connection to a redis pod that vanished with its node is found dead in about a minute
# (30 s idle + 3 probes x 10 s) instead of the kernel's two hours.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: redis-cart
  namespace: boutique
  labels:
    app.kubernetes.io/name: redis-cart
spec:
  host: redis-cart.boutique.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        connectTimeout: 1s
        tcpKeepalive:
          time: 30s
          interval: 10s
          probes: 3
