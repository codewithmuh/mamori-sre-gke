# Client-side traffic policy for every Online Boutique host. Envoy in the *calling* pod applies it
# (the frontend's sidecar for frontend -> currencyservice, the ingress gateway for gateway -> frontend).
# One DestinationRule per host. Per-host VirtualServices for these hosts are reserved for fault
# injection (#17, #23), so per-call timeouts and per-method retry rules are not set here; see
# docs/resilience/README.md, "Rules this design follows".
#
# No `tls` block anywhere: Istio's auto mTLS stays in charge, exactly as in the base (no
# PeerAuthentication, so PERMISSIVE, and sidecar-to-sidecar traffic is mutual TLS). Setting
# ISTIO_MUTUAL here would change nothing today, and would break calls to any pod that one day runs
# without a sidecar.
#
# The common profile for the nine gRPC services (all values are starting estimates):
#   connectTimeout 1s          Istio's default is 10 s. In-cluster connects take milliseconds; a pod IP
#                              that has gone away should fail fast and be retried on another pod.
#   http2MaxRequests 100       At most 100 calls in flight from one client pod to this service, and
#   http1MaxPendingRequests 50 50 waiting for a connection. Beyond that the call fails at once (503,
#                              flag UO) instead of piling up behind a slow service. About 10x the
#                              in-flight calls expected at the capacity limit (estimate, #29 measures it).
#   http2KeepAlive 10s / 3s    An HTTP/2 PING every 10 s, so a connection to a pod that vanished (node
#                              lost, network cut) is closed in about 13 s, not hours.
#   retryBudget 10 % / min 3   Retries in flight may be at most 10 % of active requests (never fewer
#                              than 3), so retries cannot multiply load during a broad failure. Without
#                              it Istio allows 2^32-1 concurrent retries. Envoy uses the budget instead
#                              of the fixed `maxRetries` circuit breaker, so `maxRetries` is not set.
#   outlierDetection           Eject a pod after 3 gateway errors in a row (connect failure, reset,
#                              timeout, 502/503/504; gRPC UNAVAILABLE and DEADLINE_EXCEEDED map to 503
#                              and 504), the signs of a sick pod. Leaf services are also ejected after
#                              5 errors of any 5xx kind in a row. Services that call others (frontend,
#                              checkoutservice, recommendationservice) are not (consecutive5xxErrors: 0;
#                              leaving it out would keep Envoy's default of 5): their 500s usually mean
#                              a dependency failed, and ejecting a healthy pod for that only moves load.
#                              gRPC errors count when the server sends them trailers-only, the normal
#                              case for these unary calls. Ejection lasts 30 s, longer each time it
#                              repeats, and never covers more than half of the pods. minHealthPercent
#                              50: below half healthy, Envoy ignores ejections (panic mode), so a
#                              single-replica service is never ejected into a total outage.
#                              Istio-injected aborts happen before routing and never count.
---
# The frontend, as seen by the ingress gateway (public traffic and the prober) and the load generator.
# It speaks HTTP/1.1 (Service port "http"), one request per connection at a time, so maxConnections
# caps the requests in flight from one client pod. Past 100 in flight and 50 queued, the gateway
# answers 503 at once instead of queueing more work for a frontend that is already behind: a second
# load-shedding layer, by concurrency, behind the rate limit in ingress-rate-limit.yaml. The retry
# budget caps the edge retries set in deploy/online-boutique/public-virtualservice.yaml.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend
  namespace: boutique
  labels:
    app.kubernetes.io/name: frontend
spec:
  host: frontend.boutique.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        connectTimeout: 1s
        maxConnections: 100
      http:
        http2MaxRequests: 100
        http1MaxPendingRequests: 50
    retryBudget:
      percent: 10
      minRetryConcurrency: 3
    outlierDetection:
      consecutive5xxErrors: 0
      consecutiveGatewayErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
---
# Ads on home and product pages. The frontend gives it 100 ms and shows no ad on error.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: adservice
  namespace: boutique
  labels:
    app.kubernetes.io/name: adservice
spec:
  host: adservice.boutique.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        connectTimeout: 1s
      http:
        http2MaxRequests: 100
        http1MaxPendingRequests: 50
        http2KeepAlive:
          interval: 10s
          timeout: 3s
    retryBudget:
      percent: 10
      minRetryConcurrency: 3
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
---
