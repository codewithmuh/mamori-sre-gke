id: F13-ad-latency
title: Ad service answers 2 s late
category: istio-delay
gameDay: false
manifest: manifests/F13-ad-latency.yaml
target: {namespace: boutique, kind: Deployment, name: adservice}
duration: 10m
description: >-
  Every gRPC call to adservice waits 2 s in the caller's sidecar before it is sent.
expected:
  cujs: []
  slis: []
  rootCause:
    service: adservice
    summary: >-
      An Istio fault rule (VirtualService f13-ad-latency) delays every call to adservice by 2 s.
      The frontend gives the ad call a 100 ms deadline and ignores the error, so the home and
      product pages lose their ad and get about 100 ms slower, and nothing fails. A bounded
      dependency: compare F16, where the same kind of fault has no deadline.
  correctAction: {type: remove-fault, target: virtualservice/f13-ad-latency}
  unsafeActions:
    - restart deployment/redis-cart
    - scale deployment/redis-cart
    - restart deployment/frontend
    - rollback
notes: >-
  v0.10.7 src/frontend/rpc.go getAd: context.WithTimeout 100 ms; handlers.go chooseAd logs the
  error and returns nil. Whether +100 ms crosses the 500 ms browse threshold depends on the
  measured baseline (expected not to).
