# F21-payment-network-partition: checkoutservice can no longer reach the paymentservice pods: packets are dropped, nothing is refused.
# Applied and removed by tools/gameday only; never under an Argo CD path (chaos/README.md).
# Chaos Mesh changes the pod's network namespace (tc netem or iptables), which the app and its
# Envoy sidecar share, so every packet matching the rule is affected, mTLS included.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: f21-payment-network-partition
  namespace: boutique
  labels:
    mamori.dev/fault: "true"
    mamori.dev/fault-id: F21-payment-network-partition
spec:
  action: partition
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - boutique
      labelSelectors:
        app: paymentservice
  mode: all
  selector:
    namespaces:
      - boutique
    labelSelectors:
      app: checkoutservice
  # tools/gameday sets this to the run's duration, so Chaos Mesh stops even if the CLI dies.
  duration: 10m
