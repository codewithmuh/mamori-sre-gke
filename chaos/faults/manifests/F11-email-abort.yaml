# F11-email-abort: every call to emailservice fails with gRPC UNAVAILABLE.
# Applied and removed by tools/gameday only; never under an Argo CD path (chaos/README.md).
# Istio applies the fault in the client's sidecar, so every caller in the mesh sees it.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: f11-email-abort
  namespace: boutique
  labels:
    mamori.dev/fault: "true"
    mamori.dev/fault-id: F11-email-abort
spec:
  hosts:
    - emailservice.boutique.svc.cluster.local
  http:
    - fault:
        abort:
          grpcStatus: UNAVAILABLE
          percentage:
            value: 100
      route:
        - destination:
            host: emailservice.boutique.svc.cluster.local
