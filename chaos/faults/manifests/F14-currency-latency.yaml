# F14-currency-latency: every call to currencyservice waits 100 ms first.
# Applied and removed by tools/gameday only; never under an Argo CD path (chaos/README.md).
# Istio applies the fault in the client's sidecar, so every caller in the mesh sees it.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: f14-currency-latency
  namespace: boutique
  labels:
    mamori.dev/fault: "true"
    mamori.dev/fault-id: F14-currency-latency
spec:
  hosts:
    - currencyservice.boutique.svc.cluster.local
  http:
    - fault:
        delay:
          fixedDelay: 100ms
          percentage:
            value: 100
      route:
        - destination:
            host: currencyservice.boutique.svc.cluster.local
