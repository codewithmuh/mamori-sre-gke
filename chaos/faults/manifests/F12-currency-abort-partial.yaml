# F12-currency-abort-partial: 5 % of calls to currencyservice fail with gRPC UNAVAILABLE.
# Applied and removed by tools/gameday only; never under an Argo CD path (chaos/README.md).
# Istio applies the fault in the client's sidecar, so every caller in the mesh sees it.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: f12-currency-abort-partial
  namespace: boutique
  labels:
    mamori.dev/fault: "true"
    mamori.dev/fault-id: F12-currency-abort-partial
spec:
  hosts:
    - currencyservice.boutique.svc.cluster.local
  http:
    - fault:
        abort:
          grpcStatus: UNAVAILABLE
          percentage:
            value: 5
      route:
        - destination:
            host: currencyservice.boutique.svc.cluster.local
