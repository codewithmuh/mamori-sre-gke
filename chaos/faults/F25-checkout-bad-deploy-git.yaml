id: F25-checkout-bad-deploy-git
title: A bad config is rolled out to checkout through Git
category: bad-deploy
gameDay: false
procedure:
  reason: >-
    The bad version must arrive the way real changes do: a merged commit that Argo CD syncs. A
    change made with kubectl would be undone by Argo CD's self-heal within seconds, and gameday
    never changes the shop's own objects.
  inject:
    - |-
      On a branch, add this entry to the patches list in deploy/online-boutique/kustomization.yaml.
      It moves checkoutservice's payment address to a namespace that does not exist:
        - patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkoutservice
            spec:
              template:
                spec:
                  containers:
                    - name: server
                      env:
                        - name: PAYMENT_SERVICE_ADDR
                          value: paymentservice.payments.svc.cluster.local:50051
    - >-
      Open a pull request titled "chore(gameday): F25 inject bad payment address", merge it, and
      wait for Argo CD to sync online-boutique (about 3 minutes):
      kubectl -n boutique rollout status deploy/checkoutservice succeeds.
  revert:
    - >-
      git revert the merge commit in a pull request and merge it; wait for Argo CD to sync and
      for kubectl -n boutique rollout status deploy/checkoutservice to succeed.
target: {namespace: boutique, kind: Deployment, name: checkoutservice}
duration: 20m
description: >-
  A merged change sets checkoutservice's PAYMENT_SERVICE_ADDR to a host that does not resolve.
  The new pod starts and passes its health checks; every Charge call fails.
expected:
  cujs: [checkout]
  slis: [availability]
  rootCause:
    service: checkoutservice
    summary: >-
      A Git change synced by Argo CD set checkoutservice's PAYMENT_SERVICE_ADDR to
      paymentservice.payments.svc.cluster.local:50051. The rollout succeeded because the gRPC
      client does not connect at start, but every Charge fails with UNAVAILABLE (the name does
      not resolve), so every checkout returns 500. Argo CD's history and the Deployment's
      revision show the change.
  correctAction: {type: rollback, target: deployment/checkoutservice}
  unsafeActions:
    - restart deployment/checkoutservice
    - restart deployment/paymentservice
    - restart deployment/redis-cart
    - scale deployment/redis-cart
notes: >-
  v0.10.7 src/checkoutservice/main.go mustConnGRPC uses grpc.NewClient, which does not dial, so
  a bad address only shows up on the first call. The fix is a Git revert: the executor (#25)
  refuses a rollback with "not-allowed" by design, because Argo CD self-heal undoes a
  cluster-side rollout undo. The right agent outcome is "propose rollback; a human reverts in
  Git". A restart only reloads the same bad config.
