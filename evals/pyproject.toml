[project]
name = "mamori-evals"
version = "0.1.0"
description = "Evaluation harness for the mamori incident agent: live fault runs, offline replay, scoring and reports."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# Exact pins; uv.lock pins the rest. Bump them by hand, at least 14 days after release.
dependencies = [
  "pyyaml==6.0.3",
]

[project.scripts]
mamori-evals = "mamori_evals.cli:main"

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mamori_evals"]

[tool.uv]
# Resolve only releases at least 14 days old, transitive ones included: the repo's pinning
# rule, and the same cooldown Dependabot uses.
exclude-newer = "14 days"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle + pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "S",             # bandit (security)
  "N",             # naming
  "PT",            # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are how pytest works; they start fake CLIs as subprocesses.
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["mamori_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mamori_evals --cov-report=term-missing --cov-fail-under=80"
